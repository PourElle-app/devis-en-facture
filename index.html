<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convertir un Devis en Facture en Ligne (Gratuit)</title>
<style>
:root{--ink:#17233b;--muted:#66758b;--blue:#5b5ce2;--line:#e5e9f2;}
body{margin:0;font:14px/1.5 Inter,sans-serif;color:var(--ink);background:#fff;}
.top{display:flex;justify-content:space-between;padding:15px 30px;border-bottom:1px solid var(--line);}
.brand{font-weight:850;font-size:20px;display:flex;gap:10px;align-items:center;}
.brandmark{width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;}
.container{max-width:800px;margin:30px auto;padding:20px;}
.form-group{display:grid;gap:5px;margin-bottom:15px;}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;}
.primary{background:var(--blue);color:#fff;padding:14px;border:0;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer;width:100%;margin-top:20px;}
select{padding:8px;border-radius:8px;border:1px solid #ccc;margin-left:auto;}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="brandmark">D</div> Devis2Facture</div>
  <select onchange="changeLang(this.value)"><option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option><option value="pt">🇧🇷 PT</option></select>
</div>
<div class="container">
  <h1 id="t_title">Convertissez votre Devis en Facture</h1>
  <div class="form-group"><label id="t_lbl_client">Nom du Client</label><input type="text" id="clientName" value="Entreprise ABC"></div>
  <div class="form-group"><label id="t_lbl_details">Détails du devis (Collez le texte ou les lignes)</label><textarea id="devisText" rows="6">Prestation : Création site web - 500 €
Maintenance : 50 € / mois</textarea></div>
  <div class="form-group"><label id="t_lbl_total">Montant Total (€)</label><input type="text" id="totalAmount" value="550"></div>
  <button class="primary" id="btnGen" onclick="generate()">Générer la Facture PDF</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
const dict = {
  fr: { title: "Convertissez votre Devis en Facture", lbl_client: "Nom du Client", lbl_details: "Détails du devis", lbl_total: "Montant Total (€)", btn: "Générer la Facture PDF", h1: "FACTURE", h2: "Client" },
  en: { title: "Convert your Quote to Invoice", lbl_client: "Client Name", lbl_details: "Quote details", lbl_total: "Total Amount (€)", btn: "Generate Invoice PDF", h1: "INVOICE", h2: "Client" },
  es: { title: "Convierte tu Presupuesto en Factura", lbl_client: "Nombre del Cliente", lbl_details: "Detalles del presupuesto", lbl_total: "Monto Total (€)", btn: "Generar Factura PDF", h1: "FACTURA", h2: "Cliente" },
  pt: { title: "Converta seu Orçamento em Fatura", lbl_client: "Nome do Cliente", lbl_details: "Detalhes do orçamento", lbl_total: "Valor Total (€)", btn: "Gerar Fatura PDF", h1: "FATURA", h2: "Cliente" }
};
let currentLang = 'fr';
window.changeLang = (l) => {
  currentLang = l; const t = dict[l];
  document.getElementById('t_title').textContent = t.title;
  document.getElementById('t_lbl_client').textContent = t.lbl_client;
  document.getElementById('t_lbl_details').textContent = t.lbl_details;
  document.getElementById('t_lbl_total').textContent = t.lbl_total;
  document.getElementById('btnGen').textContent = t.btn;
};
window.generate = async () => {
  const { PDFDocument, StandardFonts } = PDFLib;
  const doc = await PDFDocument.create(), font = await doc.embedFont(StandardFonts.Helvetica), bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const page = doc.addPage([595, 842]), { height } = page.getSize(); let y = height - 50; const t = dict[currentLang];
  page.drawText(t.h1, { x: 50, y: y - 20, size: 24, font: bold }); y -= 60;
  page.drawText(t.h2 + " : " + document.getElementById('clientName').value, { x: 50, y, size: 12, font: bold }); y -= 40;
  const lines = document.getElementById('devisText').value.split('\n');
  lines.forEach(line => { page.drawText(line, { x: 50, y, size: 11, font }); y -= 20; });
  y -= 20;
  page.drawText("TOTAL : " + document.getElementById('totalAmount').value + " €", { x: 50, y, size: 14, font: bold });
  const bytes = await doc.save(); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })); a.download = 'Facture.pdf'; a.click();
};
changeLang('fr');
</script>
</body>
</html>
